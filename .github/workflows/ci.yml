name: CI

# Documentation-only changes (docs/ and Markdown anywhere, including the
# agent rule files) skip CI entirely: no branch protection requires these
# checks, so a docs-only PR stays mergeable with zero checks reported.
# Locale/asset changes still run CI — they affect runtime behavior.
#
# The issue forms are ignored for the same reason as Markdown, and they need
# naming separately because they are YAML: GitHub reads
# `.github/ISSUE_TEMPLATE/**` itself and nothing in the workspace parses it,
# so a template edit cannot change what `cargo test` does. **Only that
# directory** — `.github/**` as a whole would take the workflows with it, and
# a change to how CI runs is the last thing that should skip CI.
#
# `paths-ignore` compares against **the whole pull request**, not the latest
# push, so a docs-only commit added to a branch that already changed Rust
# re-runs the full matrix. Fold such follow-ups into a docs commit on `main`
# after the merge, where the push filter above does skip them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

# Newer pushes to the same branch/PR supersede running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental artifacts only pay off across edits on one machine, which never
  # happens on a fresh runner, so writing them is pure cost. kache strips
  # `-C incremental` before keying by default, so this is not what makes the
  # cache hit; it only keeps the compiler from producing state nobody reads.
  CARGO_INCREMENTAL: "0"
  # Full debug info is the largest thing CI builds and the one thing it never
  # reads: no debugger attaches here, and `line-tables-only` still gives test
  # panics their file and line. Measured on one machine, `cargo test
  # --workspace --all-targets --no-run`, alternating runs:
  #
  #   | debug            | wall            | target/ | cache stores   |
  #   | full (default)   | 207.8 / 203.2 s | 7.4 GB  |         795 MB |
  #   | line-tables-only |         182.5 s | 6.0 GB  |         667 MB |
  #
  # The sizes are byte-identical across repeats; the ~11% wall-clock delta sits
  # well outside the ~2% spread between the two full-debug runs. The 16 %
  # smaller objects are the point: a warm job is dominated by *reading* them
  # back (see the cold/warm table below), so shrinking the payload shortens the
  # part of CI that a compiler cache cannot remove.
  #
  # Set here rather than in `[profile.dev]` so a local `cargo build` keeps the
  # debug info a developer of a desktop application actually wants.
  # **Changing this re-keys every entry in the bucket**: the flags are part of
  # the hash, so the first run after an edit is a cold one.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Compiler output is cached in Cloudflare R2 through kache; see the cache
  # note in the check job for why it is no longer an `actions/cache` archive.
  #
  # A fork's pull request receives no secrets, so this workflow has to build
  # without the remote cache rather than fail. `secrets` is not a context any `if:` can
  # read, so the decision is made once here — workflow-level `env` is one of the
  # few places `secrets` *is* available — and every gate downstream reads it
  # back through the `env` context, which step `if:` does allow.
  #
  # All three are required. A missing account id alone would still produce a
  # syntactically valid endpoint (`https://.r2.cloudflarestorage.com`) that
  # the cache cannot reach, and an unreachable backend fails the build rather than
  # degrading to a miss — the exact failure the fork case exists to avoid.
  #
  # Comparing each secret to '' first is load-bearing: GitHub's `&&` returns an
  # operand, not a boolean, so `secrets.A && secrets.B` would interpolate a
  # secret into the environment. Comparisons first make the whole expression
  # boolean, which stringifies to exactly 'true' or 'false'.
  REMOTE_CACHE_ENABLED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}

  # kache writes the shared prefix only from a push to a protected branch
  # (`main` is, through the `protect-default` ruleset). Without this a pull
  # request would only ever read, so its second push would recompile
  # everything its first push already built. With it, a pull request reads
  # the shared prefix first and writes what it built under this one. It is
  # read only in a `pull_request` job, so it is inert everywhere else.
  KACHE_PULL_REQUEST_PREFIX: kache-pr

# Measured effect of the R2 backend, `check` job, wall clock. sccache rows are
# CICACHE-2 (2026-08-08); kache rows are CICACHE-3 (2026-11-24, PR #648: cold is
# the first run against an empty `kache/` prefix, warm is a re-run of it):
#
#   |                  | no cache | cold    | warm    |
#   | macOS,   sccache |        — | 22m26s  | 16m55s  |
#   | Windows, sccache |        — | 29m37s  | 21m19s  |
#   | macOS,   kache   |   20m10s | 16m37s  |  7m02s  |
#   | Windows, kache   |   27m01s | 38m40s  | 12m59s  |
#
# Warm kache: macOS 94.9 % of crates from cache (98.7 % by compile time),
# Windows 99.6 % (99.9 %). The gain over sccache is the linked outputs — test
# binaries, proc macros, build scripts — that sccache compiled every time:
# warm Test went 548 s → 187 s on macOS and 740 s → 378 s on Windows.
#
# Two costs to know about. A cold Windows run is ~12 minutes slower than an
# uncached one: it compiles everything and also uploads ~3 GiB. And Windows
# restores **copy** (13.3 GiB per warm run): `D:` was NTFS for this measurement,
# where kache copies. The images move `D:` to ReFS on 2026-11-30, where restores
# clone instead; re-measure Windows after that, since kache also re-reads key
# inputs on ReFS and the net effect is not known. Uploads are content-deduplicated — the warm run uploaded a few
# MiB — so steady-state bucket growth is what each pull request changes.

jobs:
  check:
    strategy:
      # One platform failing cancels the other. The information lost is only
      # "did it fail on both?", which never changes what gets fixed first,
      # and the saving is real: a macOS failure used to leave Windows running
      # for its full ~15 minutes. A platform-specific failure is still caught
      # — the other platform passing is what lets its sibling run to the end.
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `paths-ignore` cannot skip this run (see the note at the top of the
      # file), but the push that started it may still be docs-only — a review
      # follow-up that fixes a comment on a branch that already changed Rust.
      # Diff what this push actually added and skip the expensive steps if none
      # of it is code. Every branch that cannot answer the question — a first
      # run with no `before`, a force push whose `before` is gone, a fetch that
      # fails — falls through to running everything: the guard may only ever
      # remove work that provably could not change the result.
      #
      # **Skipping is only sound if `before` was itself checked.** The diff
      # proves "this push changed no code"; it does not prove the code was ever
      # verified. `cancel-in-progress` above kills the run for `before` the
      # moment a new push lands, so a docs-only follow-up pushed while the code
      # run is still going — or any force-push, which does the same — would
      # otherwise report a green `check` that ran nothing. That happened on
      # #295: a docs-only force-push cancelled the in-flight code run and then
      # scoped the code checks away, leaving the Rust in that PR unverified
      # behind two passing checks. So ask the API what `before`'s own checks
      # concluded, and only trust the diff when they succeeded. Anything else —
      # cancelled, failed, still running, no checks, API error — falls through
      # to running everything, the same safe direction as the branches above.
      #
      # The endpoint returns every check run a commit accumulated, so a SHA that
      # was cancelled and later re-run reports both conclusions and reads as not
      # passing. That costs one redundant matrix on the next docs-only push and
      # is left alone deliberately: distinguishing "the latest attempt passed"
      # would mean ranking runs by start time, and getting that wrong skips
      # checks — the one direction this guard must never take.
      - name: Scope this push
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          list="$RUNNER_TEMP/pushed-paths.txt"
          code=true
          reason="not a push onto an existing branch"
          if [ "${{ github.event.action }}" = "synchronize" ] \
            && [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A shallow fetch of each end is enough: `git diff` compares the two
            # trees and needs no common history between them.
            if git fetch --no-tags --depth=1 origin "$BEFORE" "$AFTER" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$AFTER" >"$list" 2>/dev/null \
              && [ -s "$list" ]; then
              # Classified with shell built-ins only, reading from a file rather
              # than a pipe. `grep -qv` reads better but its exit status under
              # `-v` is not uniform across the greps a runner might ship, and a
              # pipe would put the loop in a subshell where the verdict cannot
              # escape. Both mistakes skip the code checks — the one direction
              # this guard must never take.
              code=false
              reason="the push only changed documentation"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  docs/*|*.md) ;;
                  *)
                    code=true
                    reason="the push changed $path"
                    break
                    ;;
                esac
              done <"$list"

              # The diff says this push added no code. Now establish that the
              # code as of `before` was actually checked; see the note above.
              # `[] | all` is vacuously true in jq, so the count is asserted
              # first — a commit with no `check` runs must not read as passing.
              if [ "$code" = "false" ]; then
                if prev=$(gh api \
                  "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs" \
                  --jq '[.check_runs[] | select(.name | startswith("check ")) | .conclusion]
                        | if length == 0 then "none"
                          elif all(. == "success") then "success"
                          else join(",") end' 2>/dev/null); then
                  if [ "$prev" != "success" ]; then
                    code=true
                    reason="the push only changed documentation, but ${BEFORE}'s checks were '$prev'"
                  fi
                else
                  code=true
                  reason="the push only changed documentation, but ${BEFORE}'s checks could not be read"
                fi
              fi
            else
              reason="could not diff $BEFORE..$AFTER"
            fi
          fi
          echo "run_code=$code" >> "$GITHUB_OUTPUT"
          echo "Code checks: $code ($reason)"

      - uses: jdx/mise-action@v2
        if: steps.scope.outputs.run_code == 'true'

      # kache replaced sccache (CICACHE-3): it also caches what links — proc
      # macros, build scripts, test binaries — which sccache passes through.
      #
      # The kache binary is pinned rather than tracking the action's "latest
      # release" default: a cache is only useful if the thing computing its keys
      # does not change under it, and a kache that hashes differently turns
      # every entry in the bucket into a miss on a day nobody touched this file.
      #
      # The action sets `RUSTC_WRAPPER` itself, so a run without secrets — which
      # skips this step — never names a wrapper that was not installed. Its post
      # step pushes what the daemon has not uploaded yet, stops the daemon and
      # writes the hit/miss report to the job summary.
      #
      # `s3-prefix` keeps kache's objects apart from what sccache left at the
      # bucket root. `cache-dir` under `runner.temp` keeps the store on the
      # workspace's volume (on Windows that is `D:`, not the home volume), which
      # a copy-on-write clone needs: macOS restores clone on APFS. Windows
      # restores **copy** on NTFS — kache only hardlinks there with the unsafe
      # `windows_hardlink`, which is not set — and clone on ReFS, which the
      # runner images switch `D:` to from 2026-11-30 (actions/runner-images
      # #15315). `cache-executables` is opt-in in the action
      # (and on Windows in kache itself) and is the point of switching.
      - name: Set up kache
        if: steps.scope.outputs.run_code == 'true' && env.REMOTE_CACHE_ENABLED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          version: "v2.3.0"
          s3-bucket: ravel-ci-cache
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-region: auto
          s3-prefix: kache
          s3-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: "true"
          pr-comment: "false"

      # Only `~/.cargo` is archived. `target/` used to be in this list and is
      # what broke the cache: macOS and Windows together came to roughly 11 GB
      # against a 10 GB per-repository limit, so each merge evicted the other
      # platform's generation and pull requests restored nothing. Compiler
      # output now goes to R2 through the compiler cache, which has no such ceiling and is
      # keyed per compilation unit instead of per tree. What stays here is the
      # crate download side — the registry index, the `.crate` archives and the
      # git checkouts — which the compiler cache does not hold and which is small enough
      # for both platforms to coexist.
      #
      # Restore on every run, but only write the cache from a main push. See the
      # note above the save step for why the write side is gated.
      - uses: actions/cache/restore@v4
        if: steps.scope.outputs.run_code == 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      # Both read source text only, so their verdict cannot differ by platform
      # — running them twice just spends Windows minutes (8 s + 7 s there
      # against 2 s + 0 s on macOS). Kept inside the matrix rather than hoisted
      # into a job of their own: a separate job would add a checkout, a mise
      # install and queue time, which costs more than the duplicate work saved.
      - name: Format check
        if: steps.scope.outputs.run_code == 'true' && matrix.os == 'macos-latest'
        run: mise run fmt

      - name: Anti-pattern lint
        if: steps.scope.outputs.run_code == 'true' && matrix.os == 'macos-latest'
        run: mise run lint:patterns

      - name: Clippy
        if: steps.scope.outputs.run_code == 'true'
        run: mise run clippy

      - name: Test
        if: steps.scope.outputs.run_code == 'true'
        run: mise run test

      # Runs after a failure too: when a build breaks, whether the compiler ran
      # against a warm cache is part of reading the log. The action's post step
      # puts the same numbers in the job summary; this line keeps them in the log.
      #
      # Gated on `RUSTC_WRAPPER` rather than on the setup step: the action
      # returns early without installing anything when a PR description says
      # `[no-cache]` or the download fails, and the build then runs uncached —
      # which must not turn into a red job here.
      - name: kache statistics
        if: ${{ !cancelled() && steps.scope.outputs.run_code == 'true' && env.RUSTC_WRAPPER != '' }}
        shell: bash
        run: kache stats --last-build

      # Only main writes: a pull request that saved its own generation would
      # produce a cache nobody reads again, and the `github.run_id` in the key
      # guarantees each merge publishes a fresh generation instead of an
      # exact-key hit that actions/cache would skip saving, which is what
      # previously froze this cache for a month. Archiving `~/.cargo` alone is
      # cheap; the multi-gigabyte `target/` that made this step cost nearly
      # twelve minutes on Windows is no longer in the path list — **measured at
      # 37 s on Windows and 12 s on macOS** once it was removed (CICACHE-2).
      # The scope guard can only fire on a pull request, so this never saves a
      # cache whose restore was skipped — stated here rather than left to the
      # reader to derive, so extending the guard to pushes cannot break it.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && steps.scope.outputs.run_code == 'true' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

  # The shipped configuration is `--features ffmpeg` (without it no video is
  # read), and the `check` job never enables it, so everything behind
  # `#[cfg(feature = "ffmpeg")]` used to merge without being type-checked.
  # This job compiles and tests exactly that code.
  #
  # macOS only. `ffmpeg-the-third` 6 binds FFmpeg 9 and detects the installed
  # version, so the runner needs a development FFmpeg, and Homebrew's `ffmpeg`
  # formula is the one source that reliably ships 9 headers, `pkg-config`
  # files and the `ffmpeg` CLI the tests use to synthesise footage. Windows has
  # no equally dependable way to install FFmpeg 9 development files (vcpkg
  # builds it from source, the prebuilt archives are not versioned stably), and
  # an unreliable job is worse than a missing one; add it when one exists.
  #
  # Homebrew installs the current release and cannot pin one, so the versions
  # that were actually used are printed: a red run after an FFmpeg bump reads
  # differently from a red run after a code change.
  ffmpeg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Gated exactly like the check job: a fork's pull request has no secrets
      # and has to build without the remote cache rather than fail. The inputs
      # match the check job's; see the note there.
      - name: Set up kache
        if: env.REMOTE_CACHE_ENABLED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          version: "v2.3.0"
          s3-bucket: ravel-ci-cache
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-region: auto
          s3-prefix: kache
          s3-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: "true"
          pr-comment: "false"

      # Same `~/.cargo` generation as the check job, read-only; the path list
      # must match theirs for the cache version to line up.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install FFmpeg
        shell: bash
        run: |
          set -eu
          brew install ffmpeg pkg-config
          ffmpeg -version | head -n 1
          echo "libavcodec $(pkg-config --modversion libavcodec)"

      - name: Clippy (ffmpeg)
        run: mise exec -- cargo clippy -p ravel-media -p ravel-audio -p ravel-nodes -p ravel-cli --features ffmpeg --all-targets -- -D warnings

      - name: Test (ffmpeg)
        run: mise exec -- cargo test -p ravel-media -p ravel-audio -p ravel-nodes -p ravel-cli --features ffmpeg

      - name: kache statistics
        if: ${{ !cancelled() && env.RUSTC_WRAPPER != '' }}
        shell: bash
        run: kache stats --last-build

  # Benchmarks only gate main, not pull requests. `mise run clippy` already
  # builds every bench target through --all-targets, so a PR that breaks a
  # benchmark still fails the check job; this job exists to confirm the bench
  # profile itself compiles and the harnesses run, which is worth its ~12
  # minutes once per merge rather than on every push to a branch.
  bench:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Gated exactly like the check job. A fork pushing to its own `main` runs
      # this job with no secrets, so it has to build without the remote cache
      # too. The inputs match the check job's; see the note there.
      - name: Set up kache
        if: env.REMOTE_CACHE_ENABLED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          version: "v2.3.0"
          s3-bucket: ravel-ci-cache
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-region: auto
          s3-prefix: kache
          s3-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: "true"
          pr-comment: "false"

      # This job used to keep its own cache generation, which made three
      # multi-gigabyte Rust caches compete for a 10 GB per-repository limit —
      # and the loser was always macOS, whose check cache was evicted before any
      # pull request could read it. Since bench only runs on merges while the
      # check caches are read by every pull request, this job reads the check
      # generation and writes nothing.
      #
      # The path list must still match the check job's exactly. `actions/cache`
      # folds the path list into the cache version, so any divergence between
      # the two would miss every time even on a key hit. Both lists are now
      # `~/.cargo` alone — `target/` moved to the compiler cache — and they have to stay in
      # step.
      #
      # This job used to pay a fully cold bench-profile build per merge. Cache
      # keys include the compiler flags, so it shares nothing with the debug
      # builds in the check job, but it does reuse its own output from the
      # previous merge for every crate that did not change.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Benchmark (dry run)
        run: mise exec -- cargo bench --workspace -- --test

      - name: kache statistics
        if: ${{ !cancelled() && env.RUSTC_WRAPPER != '' }}
        shell: bash
        run: kache stats --last-build
