name: CI

# Documentation-only changes (docs/ and Markdown anywhere, including the
# agent rule files) skip CI entirely: no branch protection requires these
# checks, so a docs-only PR stays mergeable with zero checks reported.
# Locale/asset changes still run CI — they affect runtime behavior.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# Newer pushes to the same branch/PR supersede running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Restore on every run, but only write the cache from a main push. See the
      # note above the save step for why the write side is gated.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Format check
        run: mise run fmt

      - name: Anti-pattern lint
        run: mise run lint:patterns

      - name: Clippy
        run: mise run clippy

      - name: Test
        run: mise run test

      # Saving a multi-gigabyte target/ costs real time — over five minutes on
      # the Windows runner — and a pull request that saved its own cache would
      # pay that on every push while producing a cache nobody reads again. So
      # only main writes: pull requests restore main's cache for free, and the
      # `github.run_id` in the key guarantees each merge publishes a fresh
      # generation instead of an exact-key hit that actions/cache would skip
      # saving, which is what previously froze this cache for a month.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

  bench:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # The bench profile produces artifacts the check job never builds, so this
      # job keeps its own cache generation.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-bench-

      - name: Benchmark (dry run)
        run: mise exec -- cargo bench --workspace -- --test

      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
