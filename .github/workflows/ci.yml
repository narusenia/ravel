name: CI

# Documentation-only changes (docs/ and Markdown anywhere, including the
# agent rule files) skip CI entirely: no branch protection requires these
# checks, so a docs-only PR stays mergeable with zero checks reported.
# Locale/asset changes still run CI — they affect runtime behavior.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# Newer pushes to the same branch/PR supersede running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental artifacts only pay off across edits on one machine, which never
  # happens on a fresh runner — and they are roughly a quarter of `target/`
  # (26 GB of a 101 GB local tree). Disabling them is what keeps the two check
  # caches inside the 10 GB per-repository limit; see the cache note below.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Restore on every run, but only write the cache from a main push. See the
      # note above the save step for why the write side is gated.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/**/incremental
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Format check
        run: mise run fmt

      - name: Anti-pattern lint
        run: mise run lint:patterns

      - name: Clippy
        run: mise run clippy

      - name: Test
        run: mise run test

      # Saving a multi-gigabyte target/ costs real time — nearly twelve minutes
      # on the Windows runner at 7.31 GB — and a pull request that saved its own
      # cache would pay that on every push while producing a cache nobody reads
      # again. So only main writes: pull requests restore main's cache for free,
      # and the `github.run_id` in the key guarantees each merge publishes a
      # fresh generation instead of an exact-key hit that actions/cache would
      # skip saving, which is what previously froze this cache for a month.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/**/incremental
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

  # Benchmarks only gate main, not pull requests. `mise run clippy` already
  # builds every bench target through --all-targets, so a PR that breaks a
  # benchmark still fails the check job; this job exists to confirm the bench
  # profile itself compiles and the harnesses run, which is worth its ~12
  # minutes once per merge rather than on every push to a branch.
  bench:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # This job used to keep its own cache generation, which made three
      # multi-gigabyte Rust caches compete for a 10 GB per-repository limit —
      # and the loser was always macOS, whose check cache was evicted before any
      # pull request could read it. Since bench only runs on merges while the
      # check caches are read by every pull request, this job now reads the
      # check generation and writes nothing. It pays a cold bench-profile build
      # per merge; that cost sits off the pull-request path.
      #
      # The path list must match the check job's exactly. `actions/cache` folds
      # the path list into the cache version, so a restore that narrowed this to
      # `~/.cargo` alone would miss every time even on a key hit. What this job
      # actually reuses is `~/.cargo`; the restored debug `target/` belongs to
      # another profile and is simply ignored.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/**/incremental
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Benchmark (dry run)
        run: mise exec -- cargo bench --workspace -- --test
