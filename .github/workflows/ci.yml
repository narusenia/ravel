name: CI

# Documentation-only changes (docs/ and Markdown anywhere, including the
# agent rule files) skip CI entirely: no branch protection requires these
# checks, so a docs-only PR stays mergeable with zero checks reported.
# Locale/asset changes still run CI — they affect runtime behavior.
#
# `paths-ignore` compares against **the whole pull request**, not the latest
# push, so a docs-only commit added to a branch that already changed Rust
# re-runs the full matrix. Fold such follow-ups into a docs commit on `main`
# after the merge, where the push filter above does skip them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# Newer pushes to the same branch/PR supersede running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental artifacts only pay off across edits on one machine, which never
  # happens on a fresh runner. sccache points the same way independently: it
  # passes an incremental invocation straight through to rustc and stores
  # nothing for it, so leaving them on would make every compile uncacheable.
  CARGO_INCREMENTAL: "0"
  # Compiler output is cached in Cloudflare R2 through sccache; see the cache
  # note in the check job for why it is no longer an `actions/cache` archive.
  #
  # A fork's pull request receives no secrets, so this workflow has to build
  # without sccache rather than fail. `secrets` is not a context any `if:` can
  # read, so the decision is made once here — workflow-level `env` is one of the
  # few places `secrets` *is* available — and every gate downstream reads it
  # back through the `env` context, which step `if:` does allow.
  #
  # All three are required. A missing account id alone would still produce a
  # syntactically valid endpoint (`https://.r2.cloudflarestorage.com`) that
  # sccache cannot reach, and an unreachable backend fails the build rather than
  # degrading to a miss — the exact failure the fork case exists to avoid.
  #
  # Comparing each secret to '' first is load-bearing: GitHub's `&&` returns an
  # operand, not a boolean, so `secrets.A && secrets.B` would interpolate a
  # secret into the environment. Comparisons first make the whole expression
  # boolean, which stringifies to exactly 'true' or 'false'.
  SCCACHE_ENABLED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}

jobs:
  check:
    strategy:
      # One platform failing cancels the other. The information lost is only
      # "did it fail on both?", which never changes what gets fixed first,
      # and the saving is real: a macOS failure used to leave Windows running
      # for its full ~15 minutes. A platform-specific failure is still caught
      # — the other platform passing is what lets its sibling run to the end.
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `paths-ignore` cannot skip this run (see the note at the top of the
      # file), but the push that started it may still be docs-only — a review
      # follow-up that fixes a comment on a branch that already changed Rust.
      # Diff what this push actually added and skip the expensive steps if none
      # of it is code. Every branch that cannot answer the question — a first
      # run with no `before`, a force push whose `before` is gone, a fetch that
      # fails — falls through to running everything: the guard may only ever
      # remove work that provably could not change the result.
      #
      # **Skipping is only sound if `before` was itself checked.** The diff
      # proves "this push changed no code"; it does not prove the code was ever
      # verified. `cancel-in-progress` above kills the run for `before` the
      # moment a new push lands, so a docs-only follow-up pushed while the code
      # run is still going — or any force-push, which does the same — would
      # otherwise report a green `check` that ran nothing. That happened on
      # #295: a docs-only force-push cancelled the in-flight code run and then
      # scoped the code checks away, leaving the Rust in that PR unverified
      # behind two passing checks. So ask the API what `before`'s own checks
      # concluded, and only trust the diff when they succeeded. Anything else —
      # cancelled, failed, still running, no checks, API error — falls through
      # to running everything, the same safe direction as the branches above.
      #
      # The endpoint returns every check run a commit accumulated, so a SHA that
      # was cancelled and later re-run reports both conclusions and reads as not
      # passing. That costs one redundant matrix on the next docs-only push and
      # is left alone deliberately: distinguishing "the latest attempt passed"
      # would mean ranking runs by start time, and getting that wrong skips
      # checks — the one direction this guard must never take.
      - name: Scope this push
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          list="$RUNNER_TEMP/pushed-paths.txt"
          code=true
          reason="not a push onto an existing branch"
          if [ "${{ github.event.action }}" = "synchronize" ] \
            && [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A shallow fetch of each end is enough: `git diff` compares the two
            # trees and needs no common history between them.
            if git fetch --no-tags --depth=1 origin "$BEFORE" "$AFTER" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$AFTER" >"$list" 2>/dev/null \
              && [ -s "$list" ]; then
              # Classified with shell built-ins only, reading from a file rather
              # than a pipe. `grep -qv` reads better but its exit status under
              # `-v` is not uniform across the greps a runner might ship, and a
              # pipe would put the loop in a subshell where the verdict cannot
              # escape. Both mistakes skip the code checks — the one direction
              # this guard must never take.
              code=false
              reason="the push only changed documentation"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  docs/*|*.md) ;;
                  *)
                    code=true
                    reason="the push changed $path"
                    break
                    ;;
                esac
              done <"$list"

              # The diff says this push added no code. Now establish that the
              # code as of `before` was actually checked; see the note above.
              # `[] | all` is vacuously true in jq, so the count is asserted
              # first — a commit with no `check` runs must not read as passing.
              if [ "$code" = "false" ]; then
                if prev=$(gh api \
                  "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs" \
                  --jq '[.check_runs[] | select(.name | startswith("check ")) | .conclusion]
                        | if length == 0 then "none"
                          elif all(. == "success") then "success"
                          else join(",") end' 2>/dev/null); then
                  if [ "$prev" != "success" ]; then
                    code=true
                    reason="the push only changed documentation, but ${BEFORE}'s checks were '$prev'"
                  fi
                else
                  code=true
                  reason="the push only changed documentation, but ${BEFORE}'s checks could not be read"
                fi
              fi
            else
              reason="could not diff $BEFORE..$AFTER"
            fi
          fi
          echo "run_code=$code" >> "$GITHUB_OUTPUT"
          echo "Code checks: $code ($reason)"

      - uses: jdx/mise-action@v2
        if: steps.scope.outputs.run_code == 'true'

      # The sccache binary is pinned rather than tracking the action's "latest
      # release" default: a cache is only useful if the thing computing its keys
      # does not change under it, and an sccache that hashes differently turns
      # every entry in the bucket into a miss on a day nobody touched this file.
      - name: Install sccache
        if: steps.scope.outputs.run_code == 'true' && env.SCCACHE_ENABLED == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"

      # `RUSTC_WRAPPER` is set here rather than in the workflow `env` so that a
      # run without secrets never names a wrapper that was not installed.
      # Secrets are read through this step's `env` instead of being interpolated
      # into the script text.
      #
      # `SCCACHE_IDLE_TIMEOUT=0` keeps the server alive for the whole job. Stats
      # live in the server process and it otherwise exits after ten idle
      # minutes; test *execution* opens no sccache connections, so a long test
      # phase would leave the stats step to start a fresh server and print zeros
      # — a false "the cache is not working" rather than a missing number.
      - name: Enable sccache
        if: steps.scope.outputs.run_code == 'true' && env.SCCACHE_ENABLED == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=ravel-ci-cache"
            echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      # Only `~/.cargo` is archived. `target/` used to be in this list and is
      # what broke the cache: macOS and Windows together came to roughly 11 GB
      # against a 10 GB per-repository limit, so each merge evicted the other
      # platform's generation and pull requests restored nothing. Compiler
      # output now goes to R2 through sccache, which has no such ceiling and is
      # keyed per compilation unit instead of per tree. What stays here is the
      # crate download side — the registry index, the `.crate` archives and the
      # git checkouts — which sccache does not cache and which is small enough
      # for both platforms to coexist.
      #
      # Restore on every run, but only write the cache from a main push. See the
      # note above the save step for why the write side is gated.
      - uses: actions/cache/restore@v4
        if: steps.scope.outputs.run_code == 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      # Both read source text only, so their verdict cannot differ by platform
      # — running them twice just spends Windows minutes (8 s + 7 s there
      # against 2 s + 0 s on macOS). Kept inside the matrix rather than hoisted
      # into a job of their own: a separate job would add a checkout, a mise
      # install and queue time, which costs more than the duplicate work saved.
      - name: Format check
        if: steps.scope.outputs.run_code == 'true' && matrix.os == 'macos-latest'
        run: mise run fmt

      - name: Anti-pattern lint
        if: steps.scope.outputs.run_code == 'true' && matrix.os == 'macos-latest'
        run: mise run lint:patterns

      - name: Clippy
        if: steps.scope.outputs.run_code == 'true'
        run: mise run clippy

      - name: Test
        if: steps.scope.outputs.run_code == 'true'
        run: mise run test

      # Runs after a failure too: when a build breaks, whether the compiler ran
      # against a warm cache is part of reading the log. `SCCACHE_PATH` is set by
      # the install step above and is what makes this one line work on Windows
      # as well.
      - name: sccache statistics
        if: ${{ !cancelled() && steps.scope.outputs.run_code == 'true' && env.SCCACHE_ENABLED == 'true' }}
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      # Only main writes: a pull request that saved its own generation would
      # produce a cache nobody reads again, and the `github.run_id` in the key
      # guarantees each merge publishes a fresh generation instead of an
      # exact-key hit that actions/cache would skip saving, which is what
      # previously froze this cache for a month. Archiving `~/.cargo` alone is
      # cheap; the multi-gigabyte `target/` that made this step cost nearly
      # twelve minutes on Windows is no longer in the path list.
      # The scope guard can only fire on a pull request, so this never saves a
      # cache whose restore was skipped — stated here rather than left to the
      # reader to derive, so extending the guard to pushes cannot break it.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && steps.scope.outputs.run_code == 'true' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

  # Benchmarks only gate main, not pull requests. `mise run clippy` already
  # builds every bench target through --all-targets, so a PR that breaks a
  # benchmark still fails the check job; this job exists to confirm the bench
  # profile itself compiles and the harnesses run, which is worth its ~12
  # minutes once per merge rather than on every push to a branch.
  bench:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Gated exactly like the check job. A fork pushing to its own `main` runs
      # this job with no secrets, so it has to build without sccache too.
      - name: Install sccache
        if: env.SCCACHE_ENABLED == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"

      - name: Enable sccache
        if: env.SCCACHE_ENABLED == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=ravel-ci-cache"
            echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      # This job used to keep its own cache generation, which made three
      # multi-gigabyte Rust caches compete for a 10 GB per-repository limit —
      # and the loser was always macOS, whose check cache was evicted before any
      # pull request could read it. Since bench only runs on merges while the
      # check caches are read by every pull request, this job reads the check
      # generation and writes nothing.
      #
      # The path list must still match the check job's exactly. `actions/cache`
      # folds the path list into the cache version, so any divergence between
      # the two would miss every time even on a key hit. Both lists are now
      # `~/.cargo` alone — `target/` moved to sccache — and they have to stay in
      # step.
      #
      # This job used to pay a fully cold bench-profile build per merge. sccache
      # keys include the compiler flags, so it shares nothing with the debug
      # builds in the check job, but it does reuse its own output from the
      # previous merge for every crate that did not change.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Benchmark (dry run)
        run: mise exec -- cargo bench --workspace -- --test

      - name: sccache statistics
        if: ${{ !cancelled() && env.SCCACHE_ENABLED == 'true' }}
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
