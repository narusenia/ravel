[workspace]
resolver = "2"
members = [
    "crates/ravel-core",
    "crates/ravel-gpu",
    "crates/ravel-nodes",
    "crates/ravel-media",
    "crates/ravel-audio",
    "crates/ravel-i18n",
    "crates/ravel-ui",
    "crates/ravel-dock",
    "crates/ravel-widgets",
    "crates/ravel-project",
    "crates/ravel-app",
    "crates/ravel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/NaruseNia/ravel"

[workspace.dependencies]
ravel-core = { path = "crates/ravel-core" }
ravel-gpu = { path = "crates/ravel-gpu" }
ravel-media = { path = "crates/ravel-media" }
ravel-i18n = { path = "crates/ravel-i18n" }
ravel-ui = { path = "crates/ravel-ui" }
ravel-dock = { path = "crates/ravel-dock" }
ravel-widgets = { path = "crates/ravel-widgets" }
# `playback` (CPAL, and with it CoreAudio / ALSA) is opt-in workspace-wide:
# only the GUI plays sound, while `ravel-cli` merely mixes one. A member that
# wants an output device says so with `features = ["playback"]`, and a
# headless build links no audio device library by default.
ravel-audio = { path = "crates/ravel-audio", default-features = false }
ravel-nodes = { path = "crates/ravel-nodes" }
ravel-project = { path = "crates/ravel-project" }
ravel-app = { path = "crates/ravel-app" }
ravel-cli = { path = "crates/ravel-cli" }

# UI framework (gpui-ce community edition, and the GPUI Kit 0.6 layers on top)
#
# The gpui-ce crates renamed themselves on crates.io (`gpui` → `gpui-ce`,
# `gpui_platform` → `gpui_ce_platform`), so every entry needs `package =`. The
# dependency *keys* stay the old names because the library names did not
# change: `use gpui::…` and `use gpui_platform::…` still resolve.
gpui = { package = "gpui-ce", git = "https://github.com/narusenia/gpui-ce-ravel", rev = "a93d6ccd0ae1d62688417bd61c66833ed5411ee7" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/narusenia/gpui-ce-ravel", rev = "a93d6ccd0ae1d62688417bd61c66833ed5411ee7", features = ["font-kit"] }
# `gpui-component` 0.6 lives in the GPUI Kit workspace, whose fork points the
# whole `gpui` family at the same gpui-ce revision pinned above. Both must move
# together: two revisions would put two `gpui` crates in the tree and make
# `Entity<T>` / `App` two different types (the shape `MED-GPU-07` took with
# wgpu, only harder to read).
gpui-component = { git = "https://github.com/narusenia/gpui-kit-ravel", rev = "7eafdc2a656ef4e635cc76cb9e873b0d9f9b7de9" }
# The behaviour layer under `gpui-component`. Ravel's own widgets are built on
# this rather than on `gpui-component`'s styled parts
# (`docs/implementation/ui-component-layer-plan.md`, `UIX-2` onward).
gpui-base = { git = "https://github.com/narusenia/gpui-kit-ravel", rev = "7eafdc2a656ef4e635cc76cb9e873b0d9f9b7de9" }
# Renamed with the kit: `gpui-component-assets` → `gpui-kit-assets`.
gpui-kit-assets = { git = "https://github.com/narusenia/gpui-kit-ravel", rev = "7eafdc2a656ef4e635cc76cb9e873b0d9f9b7de9" }
rust-embed = "8"
# **No direct `palette` dependency.** `gpui::Hsla` is
# `palette::Alpha<palette::Hsl, f32>`, but nothing here has to name palette's
# own traits: `gpui::hsla()` builds a colour, `gpui::rgb_to_hsla` /
# `gpui::hsla_to_rgba` convert between the two, `gpui::ColorExt` carries
# `opacity` / `fade_out` / `blend`, and the field types' inherent methods
# (`RgbHue::into_positive_degrees`) need no import. A crate that ends up
# spelling `IntoColor` out must pin palette at gpui-ce's exact version
# (`0.7.6`) — a different major.minor makes `palette::Hsla` a different type.

# GPU
#
# From crates.io, not a fork: GPUI's `gpui_wgpu` depends on the published
# `wgpu`, and a git source is a *different crate* to Cargo even at the same
# version. Pinning a fork here put two wgpu stacks in the tree and made the
# device sharing REQ-GPU-001 asks for structurally impossible (`MED-GPU-07`).
# Before pinning a fork again, move `gpui-ce` to the same revision in the same
# change, or the split comes straight back.
wgpu = "29.0.4"
# `msl-out` / `hlsl-out` / `spv-out` back the WGSL translation path
# (`ravel_gpu::translate`). The version must stay identical to `wgpu` above so
# both see one naga.
naga = { version = "29.0.4", features = [
    "wgsl-in",
    "msl-out",
    "hlsl-out",
    "spv-out",
] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Audio
cpal = "0.15"
dasp_sample = "0.11"
rubato = "0.14"

# Shared dependencies
thiserror = "2"
anyhow = "1"
im = { version = "15", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
smol_str = "0.3"
zeno = "0.3"
# Font face metadata for `ravel_core::text` (family, weight, slant) and the
# glyph outlines the later typography units read. Already in the tree behind
# `rustybuzz` and `swash` at this exact version, so naming it here adds a
# direct edge rather than a crate — and it is pure Rust, which is why font
# resolution can live in `ravel-core` without `ravel-cli` linking a platform
# font API (`docs/implementation/typography-plan.md`, unit 1).
ttf-parser = "0.25"
# Text shaping, line breaking and bidirectional resolution for
# `ravel_core::text::layout` (`docs/implementation/typography-plan.md`, unit
# 2). All three are pure Rust and already in the tree at these versions —
# `rustybuzz` behind `usvg`, the two `unicode-*` crates behind `cosmic-text` —
# so naming them here adds direct edges rather than crates, and none of them
# reaches a platform API. `rustybuzz::Face` derefs to `ttf_parser::Face`, which
# is why glyph outlines need no fourth crate.
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
# Polygon triangulation (`geometry::triangulate`). GeoRust's port of mapbox
# earcut: `MIT OR Apache-2.0`, `num-traits` its only dependency, and the
# `Earcut` instance keeps its scratch buffers between calls so a per-frame
# triangulation allocates nothing (`docs/implementation/path-ops-plan.md`,
# Phase 0b).
earcut = "0.4.11"
log = "0.4"
sha2 = "0.10"
notify = "8"
toml = "0.8"
serde_json = "1"
ron = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"
rayon = "1"
crossbeam-channel = "0.5"
futures = "0.3"
# `exr` backs the EXR render output (`ravel_media::encode`), which has to carry
# the evaluator's 32-bit float through without losing precision (the values are
# display-referred, not linear — see the `encode::sequence` module docs).
# Widening this feature rather than depending on the `exr` crate directly keeps
# one image codec entry point;
# `exr` and its `lebe` are BSD-3-Clause, the rest MIT / Apache-2.0 / Zlib.
image = { version = "0.25", default-features = false, features = ["png", "exr"] }
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
bincode = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
ffmpeg-the-third = "5"

# Command-line front end (`ravel-cli`). Approved as production dependencies for
# the render CLI (`docs/implementation/render-export-plan.md`, unit 3); none of
# them is linked into the GUI binary.
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
ctrlc = "3"
# The prompts of `ravel-cli interactive` (unit 7). Without default features:
# `editor` and `password` would pull `tempfile` and `zeroize` for prompts this
# CLI never asks.
dialoguer = { version = "0.12", default-features = false }

# Both patch tables have to name the same revision *and* the same package as
# `[workspace.dependencies]` above. A mismatch is not an error — it silently
# resolves a second `gpui`.
[patch.crates-io]
gpui = { package = "gpui-ce", git = "https://github.com/narusenia/gpui-ce-ravel", rev = "a93d6ccd0ae1d62688417bd61c66833ed5411ee7" }

[patch."https://github.com/zed-industries/zed"]
gpui = { package = "gpui-ce", git = "https://github.com/narusenia/gpui-ce-ravel", rev = "a93d6ccd0ae1d62688417bd61c66833ed5411ee7" }

# Keep `cargo run` (dev profile) interactive: at opt-level 0 the per-pixel
# CPU passes (shell compositing in ravel-nodes, the viewer's frame
# conversion in ravel-app) take ~1s per evaluation at the 1024px viewer
# cap, so animation playback and scrub feedback visibly lag. Optimize the
# compute-heavy crates even in dev; compile-time cost stays scoped to them.
[profile.dev.package.ravel-core]
opt-level = 2

[profile.dev.package.ravel-nodes]
opt-level = 2

[profile.dev.package.ravel-gpu]
opt-level = 2

[profile.dev.package.ravel-media]
opt-level = 2

[profile.dev.package.ravel-app]
opt-level = 1

# The curve editor moved out of ravel-app into this crate, and its paint
# sampling is 3.4x slower at opt-level 0 (measured: 32.7ms vs 9.6ms for 200
# polylines). Without this entry the move silently demoted it.
[profile.dev.package.ravel-widgets]
opt-level = 2
