# Ravel default keybindings.
#
# Format: each section is a table whose keys are command actions and whose
# values are key chords. The command id is "<section>.<action>" and must match
# ravel_ui::command::CommandId.
#
# Modifier tokens: Cmd (a.k.a. Super/Meta/Win) is the platform primary modifier
# (rendered as Cmd on macOS, Ctrl on Windows/Linux); Ctrl is the literal
# Control key; plus Shift and Alt (a.k.a. Option). Chords are "+"-separated,
# modifiers first, key last (e.g. "Cmd+Shift+Z").

[meta]
name = "Ravel Default"
author = "Ravel Team"

[app]
preferences = "Cmd+,"

[file]
new = "Cmd+N"
open = "Cmd+O"
import = "Cmd+I"
save = "Cmd+S"
save_as = "Cmd+Shift+S"
quit = "Cmd+Q"

[edit]
undo = "Cmd+Z"
redo = "Cmd+Shift+Z"
cut = "Cmd+X"
copy = "Cmd+C"
paste = "Cmd+V"

[view]
toggle_timeline = "Alt+1"
toggle_node_graph = "Alt+2"
toggle_viewer = "Alt+3"
toggle_properties = "Alt+4"
toggle_curve_editor = "Alt+5"
toggle_scopes = "Alt+6"
toggle_outliner = "Alt+7"
toggle_media_bin = "Alt+8"
cycle_preview_resolution = "Alt+R"

# Channel isolation (INSP-2). `Alt+Shift+<initial>` because the plain and
# `Alt`-modified letters are taken by the Timeline's reveal keys and the
# Viewer's tools, and because the modes are not an ordered axis one chord
# could walk. The alpha *matte* view is toolbar-only.
[viewer]
channel_rgb = "Alt+Shift+P"
channel_red = "Alt+Shift+R"
channel_green = "Alt+Shift+G"
channel_blue = "Alt+Shift+B"
channel_alpha = "Alt+Shift+A"

[composition]
settings = "Cmd+K"

[project]
exposed_parameters = "Cmd+Shift+K"

[playback]
toggle = "Space"
stop = "K"
step_forward = "Right"
step_backward = "Left"
loop_in = "B"
loop_out = "N"
loop_clear = "Alt+B"

[workspace]
edit = "Cmd+F1"
node = "Cmd+F2"
color = "Cmd+F3"
motion = "Cmd+F4"

[panel]
detach = "Cmd+Shift+D"
reattach = "Cmd+Shift+R"

[help]
about = "F1"
