# Node type labels, descriptions, and parameter docs, keyed by type_key
# (quoted: type keys contain dots). Resolved by `ravel_app::node_locale`;
# a type without an entry falls back to its raw type_key. `params.*` values
# are short parameter descriptions.

[node."constant"]
label = "Constant"
description = "Outputs a fixed scalar value."
[node."constant".params]
value = "The value to output."

[node."constant.color"]
label = "RGB Color"
description = "Outputs a fixed RGBA color."
[node."constant.color".params]
color = "The color to output."

[node."media"]
label = "Media"
description = "Outputs the frame of an imported media asset (image or video) at the current time."
[node."media".params]
asset_id = "The media asset to read, chosen from imported assets."

[node."layer.ref"]
label = "Layer Ref"
description = "References the output of another layer in the same composition."
[node."layer.ref".params]
layer = "ID of the target layer (-1 for none)."
port = "Name of the target layer's output port to read."

[node."subnet"]
label = "Subnet"
description = "Groups a nested node network. Its inner net.in / net.out nodes become this node's ports."

[node."merge"]
label = "Merge"
description = "Composites image B over image A."
[node."merge".params]
operation = "Compositing operation: over, add, or multiply."
mix = "Blend between the untouched A input (0) and the composited result (1)."

[node."math.scalar"]
label = "Math"
description = "Applies a scalar math operation to one or two values."
[node."math.scalar".params]
op = "Operation to apply. Binary ops read a and b; unary ops read a only."
a = "First operand."
b = "Second operand, used by binary ops."

[node."math.remap"]
label = "Remap"
description = "Linearly remaps a value from an input range to an output range."
[node."math.remap".params]
value = "The value to remap."
in_min = "Start of the input range."
in_max = "End of the input range."
out_min = "Start of the output range."
out_max = "End of the output range."
clamp = "Clamp the result to the output range."

