[node."merge".params]
operation = "Compositing operation: over, add, or multiply."
mix = "Blend between the untouched A input (0) and the composited result (1)."

[node."math.scalar"]
label = "Math"
description = "Applies a scalar math operation to one or two values."
[node."math.scalar".params]
op = "Operation to apply. Binary ops read a and b; unary ops read a only."
a = "First operand."
b = "Second operand, used by binary ops."

[node."math.remap"]
label = "Remap"
description = "Linearly remaps a value from an input range to an output range."
[node."math.remap".params]
value = "The value to remap."
in_min = "Start of the input range."
in_max = "End of the input range."
out_min = "Start of the output range."
out_max = "End of the output range."
clamp = "Clamp the result to the output range."

[node."math.curve"]
label = "Curve"
description = "Remaps a value through a scalar transfer curve."
[node."math.curve".params]
value = "The value to remap."
in_min = "Start of the input range."
in_max = "End of the input range."
out_min = "Start of the output range."
out_max = "End of the output range."
extrapolation = "How values outside the input range are handled: clamp, repeat, or extend the endpoint tangent."
curve = "The scalar transfer curve."

[node."vector.construct.vec2"]
label = "Construct Vec2"
description = "Builds a 2-component vector from scalar components."
[node."vector.construct.vec2".params]
x = "X component."
y = "Y component."

[node."vector.construct.vec3"]
label = "Construct Vec3"
description = "Builds a 3-component vector from scalar components."
[node."vector.construct.vec3".params]
x = "X component."
y = "Y component."
z = "Z component."

[node."vector.construct.vec4"]
label = "Construct Vec4"
description = "Builds a 4-component vector from scalar components."
[node."vector.construct.vec4".params]
x = "X component."
y = "Y component."
z = "Z component."
w = "W component."

[node."vector.split.vec2"]
label = "Split Vec2"
description = "Splits a 2-component vector into one scalar output per component."

[node."vector.split.vec3"]
label = "Split Vec3"
description = "Splits a 3-component vector into one scalar output per component."

[node."vector.split.vec4"]
label = "Split Vec4"
description = "Splits a 4-component vector into one scalar output per component."

[node."vector.swizzle.vec2"]
label = "Swizzle Vec2"
description = "Reorders or repeats components of the input vector into a 2-component vector."
[node."vector.swizzle.vec2".params]
pattern = "Component names to read, one per output component (for example xy or yx)."

[node."vector.swizzle.vec3"]
label = "Swizzle Vec3"
description = "Reorders or repeats components of the input vector into a 3-component vector."
[node."vector.swizzle.vec3".params]
pattern = "Component names to read, one per output component (for example xyz or zyx)."

[node."vector.swizzle.vec4"]
label = "Swizzle Vec4"
description = "Reorders or repeats components of the input vector into a 4-component vector."
[node."vector.swizzle.vec4".params]
pattern = "Component names to read, one per output component (for example xyzw or xxxx)."

[node."vector.length"]
label = "Vector Length"
description = "Outputs the magnitude of the input vector."

[node."vector.normalize.vec2"]
label = "Normalize Vec2"
description = "Scales a 2-component vector to unit length. A zero vector stays zero."

[node."vector.normalize.vec3"]
label = "Normalize Vec3"
description = "Scales a 3-component vector to unit length. A zero vector stays zero."

[node."vector.normalize.vec4"]
label = "Normalize Vec4"
description = "Scales a 4-component vector to unit length. A zero vector stays zero."

[node."vector.dot"]
label = "Vector Dot"
description = "Outputs the dot product of two vectors of the same arity."

[node."vector.cross.vec2"]
label = "Cross Vec2"
description = "Outputs the scalar 2D cross product of two 2-component vectors."

[node."vector.cross.vec3"]
label = "Cross Vec3"
description = "Outputs the vector cross product of two 3-component vectors."

[node."geometry.transform"]
label = "Geometry Transform"
description = "Translates, rotates, and scales geometry."
[node."geometry.transform".params]
translate = "Offset in pixels."
rotation = "Euler angles in degrees. A 2D rotation is about Z."
scale = "Scale factor per axis."
use_centroid = "Rotate and scale around the geometry's centroid instead of the pivot."
pivot = "Transform origin when use_centroid is off."

[node."geometry.merge"]
label = "Geometry Merge"
description = "Combines two geometries into one."

[node."geometry.connect"]
label = "Connect"
description = "Runs a path through the points without adding any. The primitives of the input are replaced."
[node."geometry.connect".params]
mode = "Which points to connect and in what order: index order, a nearest-neighbour chain, or the members of a group."
group = "Name of the boolean point attribute the group mode connects."
interpolation = "Straight segments, or bezier tangents estimated from the neighbouring points."
closed = "Close the path."

[node."geometry.from_image"]
label = "Image to Geometry"
description = "Wraps an image as one instance that stamps it, so geometry nodes can repeat and place it. The rectangle is the source's pixel size, centred on the origin; scaling a copy up makes it blurry."

[node."scene.add"]
label = "Scene Add"
description = "Places a geometry or another scene into a 3D scene with a transform."
[node."scene.add".params]
translate = "Offset in composition units."
rotation = "Euler angles in degrees, applied Z then Y then X."
scale = "Scale factor per axis."
pivot = "Point held fixed by the rotation and the scale."

[node."scene.merge"]
label = "Scene Merge"
description = "Combines two scenes, objects and cameras alike."

[node."scene.camera"]
label = "Camera"
description = "A scene holding one camera. Merge it with the scene to be rendered."
[node."scene.camera".params]
position = "Eye position in scene coordinates. Negative Z is in front of the composition plane."
target = "Point the camera looks at."
projection = "Perspective or orthographic."
fov = "Vertical field of view in degrees. Perspective only."
ortho_height = "Vertical extent covered, in composition units. Orthographic only."
near = "Near clip distance."
far = "Far clip distance."

[node."blur"]
label = "Blur"
description = "Blurs an image with a Gaussian kernel."
[node."blur".params]
radius = "Blur radius in pixels. Larger radii cost more; capped at 64."

[node."transform"]
label = "Transform"
description = "Applies a 2D transform (translate, rotate, scale) to an image."
[node."transform".params]
translate = "Offset in pixels."
rotation = "Rotation in degrees."
scale = "Uniform scale factor."

[node."color_correct"]
label = "Color Correct"
description = "Adjusts the brightness, contrast, and saturation of an image."
[node."color_correct".params]
brightness = "Added to every channel (-1 to 1)."
contrast = "Scales the distance from mid gray (1 is unchanged)."
saturation = "Scales the distance from luminance (1 is unchanged, 0 is gray)."

[node."rasterize"]
label = "Rasterize"
description = "Draws geometry into an image."
[node."rasterize".params]
fill = "Fill the shapes."
stroke_width = "Stroke width in pixels (0 for no stroke)."
color = "Draw color. Element Cd/alpha attributes and a connected color input take priority over it."

[node."shape.rect"]
label = "Rectangle"
description = "Creates a rectangle."
[node."shape.rect".params]
center = "Center position in pixels."
width = "Width in pixels."
height = "Height in pixels."

[node."shape.ellipse"]
label = "Ellipse"
description = "Creates an ellipse approximated by line segments."
[node."shape.ellipse".params]
center = "Center position in pixels."
radius = "Radius per axis in pixels."
segments = "Number of line segments approximating the outline."

[node."shape.polygon"]
label = "Polygon"
description = "Creates a regular polygon."
[node."shape.polygon".params]
center = "Center position in pixels."
radius = "Circumradius in pixels."
sides = "Number of sides."

[node."shape.star"]
label = "Star"
description = "Creates a star shape."
[node."shape.star".params]
center = "Center position in pixels."
outer_radius = "Radius of the outer points in pixels."
inner_radius = "Radius of the inner points in pixels."
points = "Number of points."

[node."shape.line"]
label = "Line"
description = "Creates one open path between two points."
[node."shape.line".params]
start = "Start position in pixels."
end = "End position in pixels."
segments = "Number of segments. Above one, evenly spaced intermediate points are added."

[node."shape.grid"]
label = "Grid Lines"
description = "Creates a lattice of lines: one path per row and per column. Use Grid (scatter) instead when you only want the points."
[node."shape.grid".params]
center = "Center position in pixels."
size = "Total width and height in pixels."
rows = "Number of horizontal lines."
columns = "Number of vertical lines."

[node."shape.custom_path"]
label = "Custom Path"
description = "A bezier path authored with the pen tool. Its control points are edited on the canvas, not in Properties."
[node."shape.custom_path".params]
points = "Control points with bezier tangent offsets (read-only here)."
closed = "Close the path."

[node."scatter.grid"]
label = "Grid"
description = "Instances the source geometry on a regular grid."
[node."scatter.grid".params]
count_x = "Number of instances along X."
count_y = "Number of instances along Y."
spacing = "Distance between grid points in pixels."
center = "Center of the grid in pixels."
center_input = "Re-centre each source geometry on its anchor before instancing."
source_mode = "How sources are assigned to points when several are connected: sequential or random."
source_seed = "Random seed for source assignment."

[node."scatter.circular"]
label = "Circular"
description = "Instances the source geometry on a circle."
[node."scatter.circular".params]
count = "Number of instances."
radius = "Circle radius in pixels."
center = "Center of the circle in pixels."
align_rotation = "Rotate each instance to face outward from the center."
center_input = "Re-centre each source geometry on its anchor before instancing."
source_mode = "How sources are assigned to points when several are connected: sequential or random."
source_seed = "Random seed for source assignment."

[node."scatter.path_array"]
label = "Path Array"
description = "Instances the source geometry along a path."
[node."scatter.path_array".params]
count = "Number of instances along the path."
center_input = "Re-centre each source geometry on its anchor before instancing."
source_mode = "How sources are assigned to points when several are connected: sequential or random."
source_seed = "Random seed for source assignment."

[node."scatter.scatter"]
label = "Scatter"
description = "Scatters instances of the source geometry randomly over an area."
[node."scatter.scatter".params]
count = "Number of instances."
area = "Size of the scatter area in pixels."
center = "Center of the area in pixels."
seed = "Random seed for placement."
center_input = "Re-centre each source geometry on its anchor before instancing."
source_mode = "How sources are assigned to points when several are connected: sequential or random."
source_seed = "Random seed for source assignment."

[node."attribute.set"]
label = "Attribute Set"
description = "Writes a constant attribute onto a geometry domain."
[node."attribute.set".params]
domain = "Domain to write on (point, primitive, detail, and so on)."
name = "Attribute name."
type = "Value type; decides which of the value parameters is read."
value = "Value for the float, vector, and color types."
int_value = "Value for the i32 type."
bool_value = "Value for the bool type."
string_value = "Value for the string type."

[node."style.fill"]
label = "Style Fill"
description = "Writes the fill attributes (fill flag and Cd) onto a geometry domain; rasterize resolves them per element."
[node."style.fill".params]
enabled = "Whether the elements are filled."
color = "Fill color, written to the Cd attribute."
domain = "Domain to write on (point, primitive, instance)."
group = "Bool attribute naming the elements to write; empty writes every element."

[node."style.stroke"]
label = "Style Stroke"
description = "Writes the stroke attributes (stroke_width and stroke_color) onto a geometry domain; rasterize resolves them per element."
[node."style.stroke".params]
width = "Stroke width in composition pixels; 0 draws no stroke."
color = "Stroke color, written to the stroke_color attribute."
domain = "Domain to write on (point, primitive, instance)."
group = "Bool attribute naming the elements to write; empty writes every element."
cap = "Shape of the stroke ends (butt, round, square); a Detail attribute, so one value for the geometry."
join = "Shape of the stroke corners (miter, round, bevel); a Detail attribute, so one value for the geometry."

[node."style.dash"]
label = "Style Dash"
description = "Writes the dash attributes; a dashed stroke draws on the CPU path because the GPU stroke has no arc length."
[node."style.dash".params]
pattern = "Alternating on/off run lengths in composition pixels, for example \"4,2\". Empty draws a solid stroke."
offset = "Where the pattern starts along the path, in composition pixels."

[node."attribute.promote"]
label = "Attribute Promote"
description = "Aggregates an attribute into a coarser domain (for example per-point values into one detail value)."
[node."attribute.promote".params]
source_domain = "Domain to read the attribute from."
target_domain = "Domain to write the aggregated value to."
name = "Attribute name."
aggregate = "Reduction over the source elements: average, max, or first."

[node."attribute.transfer"]
label = "Attribute Transfer"
description = "Copies an attribute from a source geometry onto the target geometry."
[node."attribute.transfer".params]
target_domain = "Domain on the target to write to."
source_domain = "Domain on the source to read from."
name = "Attribute name."
mode = "Sampling of the source: nearest or distance_weighted."

[node."attribute.path_sample"]
label = "Path Sample"
description = "Samples a position and tangent at a distance along a path."
[node."attribute.path_sample".params]
distance = "Distance along the path in pixels."

[node."attribute.curveu"]
label = "Curve U"
description = "Writes the path parameter u (0 to 1) on every point, normalized per path primitive."
[node."attribute.curveu".params]
mode = "Spacing of u: by arc length, or by vertex order."

[node."field.noise"]
label = "Noise Field"
description = "Generates a 2D simplex noise field over position, with optional fBm octaves."
[node."field.noise".params]
seed = "Random seed of the noise."
frequency = "Spatial frequency of the base octave."
octaves = "Number of fBm octaves; each doubles the frequency and halves the amplitude."

[node."field.direction_to"]
label = "Direction To Field"
description = "Returns a unit vector from each sample position toward a target point or target geometry center."
[node."field.direction_to".params]
target = "Target point used when no target geometry is connected."

[node."field.curl_noise"]
label = "Curl Flow Field"
description = "Builds a deterministic divergence-free flow field from simplex noise."
[node."field.curl_noise".params]
seed = "Random seed of the noise."
frequency = "Spatial frequency of the noise."
octaves = "Number of fBm octaves."
step = "Finite-difference step used to estimate the derivatives."

[node."field.gradient"]
label = "Gradient Field"
description = "Samples the gradient of a scalar field with centered finite differences."
[node."field.gradient".params]
step = "Finite-difference step used to estimate the derivatives."

[node."field.radial"]
label = "Radial Field"
description = "Returns an outward radial or tangent unit vector around a center."
[node."field.radial".params]
center = "Center of the radial field."
mode = "Direction mode: radial points outward; tangent follows the circle."

[node."field.falloff"]
label = "Falloff Field"
description = "A falloff that is 1 through the inner radius and fades smoothly to 0 at the outer radius."
[node."field.falloff".params]
shape = "Distance shape: sphere (around the center) or linear (along the direction)."
center = "Center position in pixels."
inner_radius = "Inside this distance the value is 1."
outer_radius = "Beyond this distance the value is 0."
direction = "Axis of a linear falloff."

[node."field.curve_remap"]
label = "Curve Remap Field"
description = "Remaps another field's values through a transfer curve."
[node."field.curve_remap".params]
points = "Control points of the transfer curve (input to output)."

[node."field.ramp"]
label = "Ramp Field"
description = "Reads another field's scalar through a colour ramp, so a number drives a hue rather than a brightness."
[node."field.ramp".params]
stops = "Colour stops of the ramp, with the interpolation between them."
in_min = "Input value that maps to the start of the ramp."
in_max = "Input value that maps to the end of the ramp."

[node."field.expression"]
label = "Expression Field"
description = "A field defined by a text expression, evaluated at every sample position."
[node."field.expression".params]
expression = "Expression text. `@P` names the sample position and `@name` reads a geometry attribute."
default = "Value returned where the expression cannot answer: a source that does not compile, and an attribute the sampled geometry does not carry."

[node."field.add"]
label = "Field Add"
description = "Adds two fields sample by sample."

[node."field.multiply"]
label = "Field Multiply"
description = "Multiplies two fields sample by sample."

[node."field.max"]
label = "Field Max"
description = "Takes the larger of two fields sample by sample."

[node."field.blend"]
label = "Field Blend"
description = "Linearly interpolates between two fields."
[node."field.blend".params]
amount = "Blend factor: 0 is the left input, 1 is the right input."

[node."field.length"]
label = "Field Length"
description = "The magnitude of a vector field, as a scalar field. The zero vector answers 0."

[node."field.angle"]
label = "Field Angle"
description = "The direction of a vector field in radians (atan2 of y over x, -pi to pi), which is what a rotation attribute can take. The zero vector answers 0."

[node."field.component"]
label = "Field Component"
description = "Reads one component of a vector field as a scalar field."
[node."field.component".params]
component = "Component to read (x, y, z, w). A component the field does not have reads 0."

[node."field.compose.vec2"]
label = "Field Compose Vec2"
description = "Builds a 2-component vector field from two scalar fields."

[node."field.compose.vec3"]
label = "Field Compose Vec3"
description = "Builds a 3-component vector field from three scalar fields."

[node."field.compose.vec4"]
label = "Field Compose Vec4"
description = "Builds a 4-component vector field from four scalar fields."

[node."field.attribute"]
label = "Attribute Field"
description = "Reads an attribute of the sampled geometry as a field."
[node."field.attribute".params]
name = "Attribute to read."
component = "Component of a multi-component attribute (x, y, z, w)."
normalize = "Rescale the attribute's own min-max range onto 0-1."
default = "Value used where the attribute is missing or unreadable."

[node."field.apply"]
label = "Apply Field"
description = "Samples a field at each geometry element and writes the result into an attribute."
[node."field.apply".params]
domain = "Domain to write on."
target = "Attribute to write."
amount = "Strength of the application (0 leaves the old value, 1 applies fully)."
combine = "How the sampled value combines with the existing one: set, add, multiply, min, max."
components = "Components to affect (empty lets the type decide: rgb for a Color or Vec4, every component otherwise; for example xy, rgb, a)."
group = "Name of a bool attribute limiting the affected elements (empty for all)."
create_if_missing = "Create the attribute when the geometry does not have it yet, instead of failing."

[export]
title = "Export"
submit = "Export"
browse = "Browse…"

[export.field]
composition = "Composition"
range = "Frame Range"
format = "Format"
directory = "Output Folder"
prefix = "File Prefix"
suffix = "File Suffix"
padding = "Number Padding"
overwrite = "Replace existing files"
audio = "Write a soundtrack (WAV)"
audio_no_decoder = "This build has no FFmpeg and cannot decode audio."
audio_silent_composition = "This composition has no layers with audio."

[export.error]
no_composition = "This project has no composition to export."
empty_composition = "This composition is zero frames long and has nothing to render."
invalid_start = "The first frame must be a whole number."
invalid_end = "The last frame must be a whole number."
empty_range = "The last frame is before the first."
range_overflow = "The last frame number is too large."
no_writer = "This format cannot be written yet."
missing_directory = "Choose an output folder."
invalid_padding = "The number padding must be between 1 and 12 digits."
output_name = "The prefix or suffix would put the frames outside the output folder."
no_gpu = "Rendering needs a GPU, and this session could not open one."

[export.unavailable]
no_writer = "no writer yet"
ffmpeg_not_linked = "this build has no FFmpeg"
ffmpeg_encoder_missing = "FFmpeg has no encoder for it"
platform_api = "the hardware encoder is unavailable"
no_platform_route = "no hardware encoder on this system"
not_offered = "not offered"

[export.notice]
completed_title = "Export finished"
# Both blanks are filled by the host; the words around them, and the line
# break, are the translator's — the same shape as `cli.result.completed`.
completed = "Wrote {count} frame(s) to\n{path}"
failed_title = "Export failed"
warning_title = "Export warning"
failed_message = "The render did not finish."
audio_failed_message = "The frames were written, but the soundtrack could not be put in place."
audio_exists_message = "A soundtrack is already there; turn on \"Replace existing files\" to overwrite it."

# The same notices `ravel-cli` prints as `audio-not-rendered` and
# `audio-source-skipped`. A render that drops sound never does so quietly.
[export.warning]
audio_not_rendered = "This composition has {count} layer(s) with audio, and the soundtrack was turned off, so the render is picture only."
audio_no_decoder = "This composition has {count} layer(s) with audio, but this build has no FFmpeg and cannot decode any, so the render is picture only."
audio_source_skipped = "The layer \"{layer}\" is silent in the mix: its media asset \"{asset}\" could not be loaded: {detail}"

[render_queue]
empty = "No renders yet"
clear_finished = "Clear Finished"
cancel = "Cancel"
frames = "frames"

[render_queue.state]
queued = "Queued"
running = "Rendering"
completed = "Done"
cancelled = "Cancelled"
failed = "Failed"
