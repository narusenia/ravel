# 設定ダイアログのサイドバーのページ。
[settings.page]
general = "一般"
appearance = "外観"
language = "言語"
cache = "キャッシュ"
keybindings = "キーバインド"
project = "プロジェクト"

# 環境設定 ▸ 一般。ほかのページに属さない挙動の設定。
