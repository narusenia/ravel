# ------------------------------------------------------------------
# `ravel-cli`（ヘッドレス書き出し）。コマンドラインで人が読む文字列のみ。
# 機械可読な出力（終了コード、JSON の error 識別子）は翻訳しない。
# ------------------------------------------------------------------

[cli.error]
load = "プロジェクト {path} を読めない: {detail}"
param_syntax = "--param は NAME=VALUE の形。\"{raw}\" はその形ではない"
param_value = "--param {name} は {type} 型。\"{raw}\" は {type} として読めない"
param_rejected = "指定されたパラメータが拒否された: {detail}"
unknown_composition = "\"{name}\" という名前のコンポジションがこのプロジェクトに無い"
ambiguous_composition = "\"{name}\" という名前のコンポジションが複数ある。--comp に id を指定する: {ids}"
no_composition = "書き出せるコンポジションが無い。--comp で指定する"
bad_range = "--range は START-END か単一フレーム。\"{raw}\" はどちらでもない"
empty_range = "フレーム範囲 {start}-{end} はフレームを含まない"
