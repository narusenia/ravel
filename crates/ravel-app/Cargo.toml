[package]
name = "ravel-app"
description = "Application entry point, configuration, and i18n for Ravel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "ravel"

[[bin]]
name = "ravel"
path = "src/main.rs"

[features]
default = []
# FFmpeg-backed decoding for media nodes and thumbnails. Off by default so
# development builds do not require FFmpeg shared libraries; enable for distribution.
ffmpeg = ["ravel-audio/ffmpeg", "ravel-media/ffmpeg", "ravel-nodes/ffmpeg"]

[dependencies]
gpui-component-assets = { workspace = true }
rust-embed = { workspace = true }
# The GUI is the half of the workspace that opens an output device.
ravel-audio = { workspace = true, features = ["playback"] }
ravel-core = { workspace = true }
ravel-dock = { workspace = true }
ravel-gpu = { workspace = true }
ravel-i18n = { workspace = true }
ravel-media = { workspace = true }
ravel-nodes = { workspace = true }
ravel-project = { workspace = true }
ravel-ui = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# **Examples only.** `examples/shared_metal_device.rs` drives the async
# `interop::context_from_native` from a synchronous GPUI render pass. The
# shipped binary keeps its GPU work on the evaluation worker and never blocks
# a thread on a future, so this edge stops at the dev-dependency boundary.
pollster = { workspace = true }
tempfile = { workspace = true }
# **Tests only.** `tests/export_pipeline.rs` is the unit's "the GUI goes
# through the same worker and the same encoder as the CLI" criterion, and the
# only way to show that rather than restate it is to plan and run the same
# export through `ravel-cli`'s own `plan_render` / `execute` and compare the
# bytes. A dev-dependency adds no edge to the shipped `ravel` binary, and none
# to `cargo build -p ravel-cli`, whose GUI-free dependency list is the whole
# point of that crate — the arrow points this way, never back.
ravel-cli = { workspace = true }
