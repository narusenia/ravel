[package]
name = "ravel-cli"
description = "Headless render front end for Ravel (`ravel-cli render`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ravel-cli"
path = "src/main.rs"

[features]
default = []
# FFmpeg-backed decoding for media nodes. Off by default so a plain build
# needs no FFmpeg shared libraries; image-sequence output never needs it.
ffmpeg = ["ravel-audio/ffmpeg", "ravel-media/ffmpeg", "ravel-nodes/ffmpeg"]

[dependencies]
# Without `features = ["playback"]` this is CPAL-free: a headless render node
# mixes a soundtrack, and must not have to provide CoreAudio or ALSA to do
# so. `tests/cli_binary.rs` pins it.
ravel-audio = { workspace = true }
ravel-core = { workspace = true }
ravel-gpu = { workspace = true }
ravel-i18n = { workspace = true }
ravel-media = { workspace = true }
ravel-nodes = { workspace = true }
ravel-project = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
