[package]
name = "ravel-core"
description = "Core DAG evaluation engine, type system, and graph data structures for Ravel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
im = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
bincode = { workspace = true }
ron = { workspace = true }
bytemuck = { workspace = true }
earcut = { workspace = true }
ttf-parser = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
# The gpui warning `logging::PINNED_QUIET` silences arrives through the
# `log` facade, so the test that proves it is silenced has to emit it that
# way. Test-only: nothing in the crate logs through `log`.
log = { workspace = true }
tracing-log = "0.2"

[[bench]]
name = "eval_bench"
harness = false
