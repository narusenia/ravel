[package]
name = "ravel-media"
description = "FFmpeg integration, HW decode, audio engine, and OCIO for Ravel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
ffmpeg = ["dep:ffmpeg-the-third"]

[dependencies]
ravel-core = { workspace = true }
# PNG and EXR sequence writing. Not behind the `ffmpeg` feature on purpose:
# image sequences are the output path that must work in every build
# (`docs/implementation/render-export-plan.md`, "v1 の出力形式").
image = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
ffmpeg-the-third = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "decode_bench"
harness = false
required-features = ["ffmpeg"]
