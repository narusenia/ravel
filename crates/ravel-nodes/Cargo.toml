[package]
name = "ravel-nodes"
description = "Built-in node processors for the Ravel DAG evaluation pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables FFmpeg-backed decoding for the `media` node.
ffmpeg = ["ravel-media/ffmpeg"]

[dependencies]
ravel-core = { workspace = true }
ravel-gpu = { workspace = true }
ravel-media = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
zeno = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Test-only: the `ffmpeg`-gated media tests synthesize their fixtures on disk,
# the way `ravel-media`'s own integration tests do.
tempfile = { workspace = true }
# Benchmark-only: the particle proxy in `examples/perf_baseline.rs` measures the
# serial and rayon step side by side.
rayon = { workspace = true }
