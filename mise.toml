# Tool and task management for Ravel.
#
# `mise run check` is the canonical verification entry point; CI and the
# lefthook pre-commit hook run the same tasks. Run `mise run hooks:install`
# once after cloning to enable the git hooks, and `mise run worktrees:setup`
# once to let `.worktrees/` checkouts share the main `target/`.

[tools]
rust = { version = "1.95", components = "rustfmt,clippy", profile = "minimal" }
"npm:lefthook" = "2.1.5"
ripgrep = "14"
jq = "1.8"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks."lint:patterns"]
description = "Anti-pattern lint (see .agents/rules/gpui.md)"
run = "bash scripts/lint-patterns.sh"

[tasks.clippy]
description = "Clippy with warnings denied (default features — CI parity)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."clippy:all"]
description = "Clippy including optional features (needs FFmpeg installed)"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Workspace test suite"
run = "cargo test --workspace"

# Opt-in. A process per test, which buys per-test isolation and `--retries` for
# chasing a flake; on an already-compiled tree it runs this suite in about the
# same wall time as `mise run test` with noticeably less variance, spending
# roughly double the CPU to do it (it pools every test binary at once instead of
# running them crate by crate).
#
# It is not the lever for CI time: there the test step is dominated by compiling
# the test binaries, which nextest does not change.
#
# **It does not run doctests.** Today that costs nothing — the workspace has one
# doc example and it is `ignored` — but a doctest added later would silently drop
# out of this task. Pair it with `cargo test --workspace --doc` if that changes.
#
# Requires `cargo-nextest` on PATH (https://nexte.st); `mise run test` does not,
# which is why that one stays what `check` and CI run.
[tasks.nextest]
description = "Workspace tests under nextest (process per test; needs cargo-nextest)"
run = "cargo nextest run --workspace"

[tasks.check]
description = "Full verification (fmt + lint + clippy + test)"
depends = ["fmt", "lint:patterns", "clippy", "test"]

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = "lefthook install"

# Every worktree under `.worktrees/` builds into the main checkout's `target/`.
# Cargo reads `.cargo/config.toml` from each parent directory, so one file at
# `.worktrees/.cargo/config.toml` (gitignored with the worktrees) covers every
# cargo call — `mise run`, a bare `cargo`, rust-analyzer. Without it a fresh
# worktree recompiles every dependency into its own ~18 GB `target/`.
# Concurrent builds in two worktrees take turns on cargo's lock.
[tasks."worktrees:setup"]
description = "Share the main checkout's target/ with every .worktrees/ checkout"
run = """
root="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
mkdir -p "$root/.worktrees/.cargo"
printf '[build]\ntarget-dir = "../target"\n' > "$root/.worktrees/.cargo/config.toml"
"""

[tasks."docs:search"]
description = "Search the docs by role (see scripts/docs.sh for subcommands)"
run = "bash scripts/docs.sh"

[tasks."docs:check"]
description = "Documentation consistency (links, index coverage, issue counts)"
run = "bash scripts/docs.sh check"
